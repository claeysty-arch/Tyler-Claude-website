<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Coastal — A dream by the shore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #fff7ef;
    --ink-dim: rgba(255, 247, 239, 0.78);
    --ink-faint: rgba(255, 247, 239, 0.6);
    --shadow: 0 2px 24px rgba(40, 10, 60, 0.55);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a0a2e;
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-weight: 300;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    /* tall page so scroll can move camera forward */
    min-height: 260vh;
  }
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }
  /* subtle vignette for contrast */
  #bg::after { content: ""; }
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(20, 6, 40, 0.55) 100%);
  }
  .ui {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(20px, 4vw, 48px);
  }
  .ui > * { pointer-events: auto; }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
    text-shadow: var(--shadow);
    padding: 8px 14px;
    border: 1px solid rgba(255, 247, 239, 0.35);
    border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    background: rgba(255, 247, 239, 0.06);
  }
  .nav {
    display: flex;
    gap: 22px;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    text-shadow: var(--shadow);
  }
  .nav a {
    color: inherit;
    text-decoration: none;
    transition: color .3s ease;
  }
  .nav a:hover { color: var(--ink); }

  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 0;
  }
  .hero h1 {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(72px, 17vw, 240px);
    line-height: 0.92;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--ink);
    text-shadow: 0 4px 40px rgba(40, 10, 60, 0.6), 0 1px 0 rgba(255, 200, 150, 0.15);
  }
  .hero .sub {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: clamp(16px, 2.2vw, 22px);
    letter-spacing: 0.04em;
    color: var(--ink-dim);
    margin-top: 14px;
    text-shadow: var(--shadow);
  }

  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-shadow: var(--shadow);
  }
  .bottom .scroll {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .scroll .bar {
    display: inline-block;
    width: 36px;
    height: 1px;
    background: currentColor;
    opacity: 0.7;
    animation: grow 2.4s ease-in-out infinite;
  }
  @keyframes grow {
    0%, 100% { transform: scaleX(0.3); opacity: .4; }
    50%      { transform: scaleX(1);   opacity: .9; }
  }

  @media (max-width: 560px) {
    .nav { display: none; }
    .bottom { font-size: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scroll .bar { animation: none; }
  }
</style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="ui">
    <header class="top">
      <span class="label">A Claude Experiment</span>
      <nav class="nav" aria-label="Primary">
        <a href="#">Shore</a>
        <a href="#">Horizon</a>
        <a href="#">Return</a>
      </nav>
    </header>

    <section class="hero">
      <h1><em>Coastal</em></h1>
      <p class="sub">A dream by the shore</p>
    </section>

    <footer class="bottom">
      <span>24°N &nbsp;·&nbsp; Golden Hour</span>
      <span class="scroll"><span class="bar"></span>Scroll</span>
    </footer>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  const canvas = document.getElementById('bg');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: false,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x1a0a2e, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x3a1a4e, 40, 180);

  const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    500
  );
  const baseCamPos = new THREE.Vector3(0, 4.2, 22);
  camera.position.copy(baseCamPos);
  camera.lookAt(0, 3, 0);

  // ---------- sky dome ----------
  const skyGeo = new THREE.SphereGeometry(250, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      cBot:  { value: new THREE.Color('#FF8860') },   // warm horizon orange
      cMid:  { value: new THREE.Color('#E94F7C') },   // sunset pink
      cTop:  { value: new THREE.Color('#4A2A7A') },   // deep violet
      cApex: { value: new THREE.Color('#1B0B3A') }    // night sky
    },
    vertexShader: `
      varying vec3 vWorld;
      void main(){
        vWorld = (modelMatrix * vec4(position,1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vWorld;
      uniform vec3 cBot, cMid, cTop, cApex;
      void main(){
        float h = normalize(vWorld).y;            // -1 .. 1
        float t = clamp(h*0.5+0.5, 0.0, 1.0);     // 0 bot, 1 top
        vec3 col;
        if(t < 0.35){
          col = mix(cBot, cMid, smoothstep(0.0, 0.35, t));
        } else if(t < 0.7){
          col = mix(cMid, cTop, smoothstep(0.35, 0.7, t));
        } else {
          col = mix(cTop, cApex, smoothstep(0.7, 1.0, t));
        }
        // subtle banding noise to kill color bands
        float n = fract(sin(dot(vWorld.xy, vec2(12.9898,78.233))) * 43758.5453);
        col += (n - 0.5) * 0.01;
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);

  // ---------- sun / moon disc with faux bloom ----------
  const sunGroup = new THREE.Group();
  sunGroup.position.set(-2, 6.5, -60);
  scene.add(sunGroup);

  const sunCore = new THREE.Mesh(
    new THREE.CircleGeometry(5.2, 64),
    new THREE.MeshBasicMaterial({
      color: 0xfff2d6,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  sunGroup.add(sunCore);

  // faux bloom: several larger fading discs, additive
  const haloColors = [0xffc98a, 0xff8a6a, 0xe45f88, 0x8a4fb0];
  const haloSizes  = [7.2, 10.5, 16, 26];
  const haloOpac   = [0.55, 0.32, 0.18, 0.09];
  haloColors.forEach((c, i) => {
    const m = new THREE.Mesh(
      new THREE.CircleGeometry(haloSizes[i], 64),
      new THREE.MeshBasicMaterial({
        color: c,
        transparent: true,
        opacity: haloOpac[i],
        blending: THREE.AdditiveBlending,
        depthWrite: false
      })
    );
    m.position.z = -0.01 * (i + 1);
    sunGroup.add(m);
  });

  // small moon rising opposite
  const moon = new THREE.Mesh(
    new THREE.CircleGeometry(1.4, 48),
    new THREE.MeshBasicMaterial({
      color: 0xfff4e2,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  moon.position.set(14, 10, -80);
  scene.add(moon);
  const moonHalo = new THREE.Mesh(
    new THREE.CircleGeometry(3.6, 48),
    new THREE.MeshBasicMaterial({
      color: 0xcfd8ff,
      transparent: true,
      opacity: 0.18,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  moonHalo.position.copy(moon.position);
  moonHalo.position.z -= 0.01;
  scene.add(moonHalo);

  // ---------- ocean ----------
  const oceanGeo = new THREE.PlaneGeometry(400, 400, 180, 180);
  const oceanMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:    { value: 0 },
      uAmp:     { value: reduceMotion ? 0.0 : 0.38 },
      uDeep:    { value: new THREE.Color('#1a0a3a') },
      uMid:     { value: new THREE.Color('#5a2a7a') },
      uShallow: { value: new THREE.Color('#ff7a8a') },
      uFoam:    { value: new THREE.Color('#ffe4cc') },
      uSunDir:  { value: new THREE.Vector3(-0.2, 0.2, -1).normalize() }
    },
    vertexShader: `
      uniform float uTime;
      uniform float uAmp;
      varying float vH;
      varying vec2  vUv;
      varying vec3  vPos;

      // cheap layered sine waves
      float wave(vec2 p, vec2 dir, float freq, float speed, float t){
        return sin(dot(p, dir) * freq + t * speed);
      }

      void main(){
        vUv = uv;
        vec3 p = position;
        float t = uTime;
        float h = 0.0;
        h += wave(p.xy, vec2( 1.0, 0.2), 0.18, 0.9, t) * 1.00;
        h += wave(p.xy, vec2(-0.6, 0.8), 0.31, 1.3, t) * 0.55;
        h += wave(p.xy, vec2( 0.3,-0.9), 0.55, 1.7, t) * 0.30;
        h += wave(p.xy, vec2( 0.9, 0.1), 0.92, 2.1, t) * 0.16;
        h *= uAmp;
        p.z += h;
        vH = h;
        vPos = p;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }
    `,
    fragmentShader: `
      varying float vH;
      varying vec2 vUv;
      varying vec3 vPos;
      uniform vec3 uDeep, uMid, uShallow, uFoam;
      uniform vec3 uSunDir;

      void main(){
        // distance from camera band for depth-ish color
        float d = clamp(1.0 - length(vPos.xy) / 180.0, 0.0, 1.0);

        // base vertical gradient: deeper purple far, warmer near horizon line
        vec3 base = mix(uDeep, uMid, smoothstep(-0.3, 0.8, vH));
        base = mix(base, uShallow, smoothstep(0.15, 0.9, vH) * 0.7);

        // sun reflection streak along +y (world forward)
        float streak = smoothstep(0.18, 0.0, abs(vUv.x - 0.5));
        streak *= smoothstep(0.35, 0.95, vUv.y);
        base += uShallow * streak * 0.55;
        base += uFoam    * streak * smoothstep(0.6, 1.0, vUv.y) * 0.4;

        // crest foam
        float foam = smoothstep(0.32, 0.55, vH);
        base = mix(base, uFoam, foam * 0.55);

        // far fog-ish fade into sky color
        float horizon = smoothstep(0.55, 1.0, vUv.y);
        base = mix(base, vec3(0.92, 0.55, 0.45), horizon * 0.35);

        gl_FragColor = vec4(base, 1.0);
      }
    `
  });
  const ocean = new THREE.Mesh(oceanGeo, oceanMat);
  ocean.rotation.x = -Math.PI / 2;
  ocean.position.y = 0;
  scene.add(ocean);

  // ---------- palm tree factory ----------
  function makePalm(height, trunkColor, leafColor) {
    const palm = new THREE.Group();

    // trunk — tapered segments for natural look
    const segs = 7;
    let y = 0;
    for (let i = 0; i < segs; i++) {
      const rb = 0.22 * (1 - i * 0.08);
      const rt = 0.22 * (1 - (i + 1) * 0.08);
      const h  = height / segs;
      const seg = new THREE.Mesh(
        new THREE.CylinderGeometry(rt, rb, h, 10, 1),
        new THREE.MeshBasicMaterial({ color: trunkColor })
      );
      // slight bend each segment
      const bend = (i - segs / 2) * 0.03;
      seg.position.set(bend * 0.7, y + h / 2, 0);
      seg.rotation.z = bend * 0.25;
      palm.add(seg);
      y += h;
    }

    // crown position
    const crownY = height + 0.1;

    // a frond is a thin, slightly curved plane
    function makeFrond() {
      const len = 3.2 + Math.random() * 0.6;
      const geo = new THREE.PlaneGeometry(len, 0.55, 14, 1);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        // taper width
        const taper = 1.0 - Math.pow(Math.abs(x) / (len / 2), 1.4);
        pos.setY(i, y * taper);
        // droop along length
        const droop = -Math.pow(Math.max(0, x) / len, 2) * 1.6;
        pos.setZ(i, droop);
      }
      geo.computeVertexNormals();
      const mat = new THREE.MeshBasicMaterial({
        color: leafColor,
        side: THREE.DoubleSide
      });
      return new THREE.Mesh(geo, mat);
    }

    const fronds = new THREE.Group();
    fronds.position.y = crownY;
    const count = 9;
    for (let i = 0; i < count; i++) {
      const f = makeFrond();
      const angle = (i / count) * Math.PI * 2;
      f.rotation.y = angle;
      // tilt upward-ish, some droop
      f.rotation.z = -0.25 - Math.random() * 0.15;
      f.position.x = Math.cos(angle) * 0.15;
      f.position.z = Math.sin(angle) * 0.15;
      f.userData.baseRotZ = f.rotation.z;
      f.userData.phase = Math.random() * Math.PI * 2;
      fronds.add(f);
    }
    palm.add(fronds);
    palm.userData.fronds = fronds;
    palm.userData.sway  = Math.random() * Math.PI * 2;
    return palm;
  }

  const palms = [];
  // silhouette palette — dark warm tones that read against sunset
  const trunkTones = [0x2a1530, 0x3a1a38, 0x4a2030];
  const leafTones  = [0x2a3a28, 0x3a4630, 0x4a5a36];

  const palmSpecs = [
    { x: -7.5, z:  2.0, h: 6.2, s: 1.0 },
    { x:  8.2, z:  1.2, h: 6.8, s: 1.05 },
    { x: -3.0, z: -1.5, h: 5.4, s: 0.9 },
    { x:  4.5, z: -2.0, h: 5.9, s: 0.95 },
    { x: -11,  z: -3.2, h: 5.0, s: 0.85 }
  ];

  palmSpecs.forEach((spec, i) => {
    const palm = makePalm(
      spec.h,
      trunkTones[i % trunkTones.length],
      leafTones[i % leafTones.length]
    );
    palm.position.set(spec.x, 0.05, spec.z);
    palm.scale.setScalar(spec.s);
    palm.rotation.y = Math.random() * Math.PI * 2;
    scene.add(palm);
    palms.push(palm);
  });

  // small sand mound base so trunks don't float on water visually
  const sandGeo = new THREE.PlaneGeometry(60, 14, 1, 1);
  const sandMat = new THREE.MeshBasicMaterial({ color: 0x2a1838, transparent: true, opacity: 0.9 });
  const sand = new THREE.Mesh(sandGeo, sandMat);
  sand.rotation.x = -Math.PI / 2;
  sand.position.set(0, 0.02, 3.5);
  scene.add(sand);

  // ---------- drifting particles ----------
  const PARTICLES = 320;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(PARTICLES * 3);
  const pSeed = new Float32Array(PARTICLES);
  for (let i = 0; i < PARTICLES; i++) {
    pPos[i * 3 + 0] = (Math.random() - 0.5) * 60;
    pPos[i * 3 + 1] = Math.random() * 18 + 1;
    pPos[i * 3 + 2] = (Math.random() - 0.5) * 40 - 5;
    pSeed[i] = Math.random() * 1000;
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const pMat = new THREE.PointsMaterial({
    color: 0xffe0c2,
    size: 0.07,
    transparent: true,
    opacity: 0.75,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  });
  const particles = new THREE.Points(pGeo, pMat);
  scene.add(particles);

  // ---------- interactions ----------
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('pointermove', (e) => {
    mouse.tx = (e.clientX / window.innerWidth)  * 2 - 1;
    mouse.ty = (e.clientY / window.innerHeight) * 2 - 1;
  }, { passive: true });

  let scrollY = 0, scrollTarget = 0;
  window.addEventListener('scroll', () => {
    scrollTarget = window.scrollY || window.pageYOffset || 0;
  }, { passive: true });

  function onResize() {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  }
  window.addEventListener('resize', onResize);

  // ---------- loop ----------
  const clock = new THREE.Clock();
  const MAX_TILT = THREE.MathUtils.degToRad(5); // max 5° parallax

  function tick() {
    const t = clock.getElapsedTime();

    if (!reduceMotion) {
      oceanMat.uniforms.uTime.value = t;
    }

    // palm sway
    palms.forEach((palm, idx) => {
      const fr = palm.userData.fronds;
      const s  = palm.userData.sway + idx;
      const breeze = reduceMotion ? 0 : Math.sin(t * 0.6 + s) * 0.04;
      palm.rotation.z = breeze;
      if (fr) {
        fr.children.forEach((f, i) => {
          const ph = f.userData.phase;
          f.rotation.z = f.userData.baseRotZ +
            (reduceMotion ? 0 : Math.sin(t * 1.4 + ph + i) * 0.07);
        });
      }
    });

    // particles drift
    if (!reduceMotion) {
      const arr = pGeo.attributes.position.array;
      for (let i = 0; i < PARTICLES; i++) {
        const ix = i * 3;
        arr[ix + 0] += Math.sin(t * 0.3 + pSeed[i]) * 0.003;
        arr[ix + 1] += 0.006 + Math.sin(t * 0.5 + pSeed[i]) * 0.002;
        arr[ix + 2] += Math.cos(t * 0.25 + pSeed[i]) * 0.002;
        if (arr[ix + 1] > 22) arr[ix + 1] = 0.5;
      }
      pGeo.attributes.position.needsUpdate = true;
    }

    // camera: mouse parallax + scroll forward
    mouse.x += (mouse.tx - mouse.x) * 0.05;
    mouse.y += (mouse.ty - mouse.y) * 0.05;
    scrollY += (scrollTarget - scrollY) * 0.08;

    const scrollNorm = Math.min(scrollY / Math.max(1, document.body.scrollHeight - window.innerHeight), 1);
    const forward = scrollNorm * 14; // move forward up to 14 units
    camera.position.x = baseCamPos.x + mouse.x * 1.2;
    camera.position.y = baseCamPos.y - mouse.y * 0.6 - scrollNorm * 0.8;
    camera.position.z = baseCamPos.z - forward;

    // smooth yaw/pitch clamped to ±5°
    const yaw   = THREE.MathUtils.clamp(-mouse.x * 0.14, -MAX_TILT, MAX_TILT);
    const pitch = THREE.MathUtils.clamp( mouse.y * 0.10, -MAX_TILT, MAX_TILT);
    const look = new THREE.Vector3(0, 3 + pitch * 6, -10);
    camera.lookAt(look.x + yaw * 8, look.y, look.z);

    // face sun/moon discs toward camera
    sunGroup.lookAt(camera.position);
    moon.lookAt(camera.position);
    moonHalo.lookAt(camera.position);

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  onResize();
  tick();
})();
</script>
</body>
</html>
